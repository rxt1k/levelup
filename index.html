<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Up System</title>
    <link rel="stylesheet" href="solo.css">
</head>
<body>
    <div class="system-container">
        <div class="system-terminal">
            <div class="system-header">
                <span class="system-prompt">SYSTEM:</span>
                <span class="system-message">WELCOME, GRINDER. ENTER YOUR NAME TO BEGIN.</span>
            </div>
            <div class="input-container">
                <input type="text" id="nameInput" class="system-input" placeholder="TYPE YOUR NAME...">
                <input type="date" id="dobInput" class="system-input" placeholder="DATE OF BIRTH">
                <button id="submitBtn" class="system-btn">INITIALIZE</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
